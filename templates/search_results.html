{% extends 'base.html' %}

{% block content %}
<h2> Search Results For: {{ query }}</h2>
    <div class="articles">
        {% for article in articles %}
            <article>
                <h2><a href="{{ article[1].link }}">{{ article[1].title }}</a></h2>
                <p>{{ article[1].published }}</p>
                {% if article[1].summary %}
                <p>{{ article[1].summary }}</p>
                {% endif %}
                <p>Source: {{ article[0] }}</p>
            </article>
        {% endfor %}
    </div>
  
{% endblock %}
